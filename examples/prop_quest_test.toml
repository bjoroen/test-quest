[setup]
base_url = "http://localhost:6969"
command = "cargo"
args = ["r", "-p", "test_app"]
ready_when = "/health"
env = { SOME_ENV = "some_env_value" }

[db]
db_type = "postgres"
image_ref = { name = "postgis/postgis", tag = "15-3.5-alpine" }
migration_dir = "./utils/test_app/migrations"

[global]
headers = { Authorization = "api-key 1234-1234-1234-1234" }

[[test_groups]]
name = "some name"

[[test_groups.tests]]
name = "some name"
method = "GET"
url = "/some-url"

[[prop_tests]]
name = "ChangeUserPassword"
description = "Changing password should update the database correctly"
# iterations = 50
props = { password = "string(1,20)" }
before_run = { run_sql = [
  "INSERT INTO users (id, name, password) VALUES (6, 'Harry Potter', '123') ON CONFLICT (id) DO NOTHING;",
] }

[[prop_tests.steps]]
name = "change_password"
method = "PATCH"
url = "/login/password/change"
body = { username = "Harry Potter", password = "props.password" }
expect_status = 200

[[prop_tests.steps]]
name = "verify_db"
method = "N/A"
assert_props = [
  { left = "SELECT password FROM users WHERE id = {response.body.id};", op = "==", right = "steps.change_password.body.password" },
]


